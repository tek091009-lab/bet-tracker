name: Deploy Bet Tracker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify live Bet Tracker
        shell: bash
        run: |
          rm -rf dist && mkdir -p dist
          python - <<'PYBUILD'
          from pathlib import Path
          import hashlib
          src=''.join(Path('app.b64').read_text().split())
          fix=''.join(Path(f'fix05/p{i}.b64').read_text() for i in range(6))
          assert len(src)==121204 and len(fix)==12000
          good=src[:97000]+fix+src[109000:]
          assert hashlib.sha256(good.encode()).hexdigest()=='34eb75c33807001ef90e9a83c26b35239044f4117287d30cc91fc0a13e9771c9'
          Path('/tmp/base.b64').write_text(good)
          PYBUILD
          base64 --decode /tmp/base.b64 | gzip -dc > dist/index.html
          cat upgrade/extra-*.b64 > /tmp/extra.b64
          base64 --decode /tmp/extra.b64 | gzip -dc > /tmp/bt-extra-body.html
          printf '\n' > /tmp/bt-extra.html
          cat /tmp/bt-extra-body.html >> /tmp/bt-extra.html
          python upgrade.py
          python release_patch.py
          python connections_patch.py
          python crash_hotfix.py
          python bettracker_hotfix.py
          python stability_patch.py
          python auth_isolation_patch.py
          python bet365_patch.py
          python import_ui_v2.py
          python bet365_grid_v2.py
          python -O bet365_table_v3.py
          python bet365_layout_fix.py
          python event_time_patch.py
          python bookmaker_running_balance_patch.py
          python - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,re
          p=Path('dist/index.html'); b=p.read_bytes(); s=b.decode()
          assert len(b)==423725
          assert hashlib.sha256(b).hexdigest()=='cb2ef414ab60c37f09d48ca790e56d0aa2763225b561efae6666487371092ada'
          assert '@users.holidaysavings.app' not in s
          assert 'Existing Bet Tracker Excel' not in s
          assert 'bt-bulk-bets-v1' not in s
          assert 'data-bet-id' not in s
          assert 'sessionStorage.clear()' not in s
          assert 'AUTH_NAMESPACE="bettracker-auth:"' in s
          assert 'bt-bet365-import-v1' not in s
          assert 'bt-bet365-import-v2' not in s
          assert 't.transactions.filter(b=>b.date<=n.date)' not in s
          for x in ['bt-online-controller','bt-live-v2-enhancer','bt-import-bets-v1','bt-connections-card-import-v2','bt-bet365-import-v3','window.bt365OpenDedicated','id="bt365-dedicated-import"','BET365 HISTORY','Bet365 Statement of All Transactions PDF','if(bookmaker==="Bet365"){window.bt365OpenDedicated?.();return}','Convert PDF to table','pdfjs-dist@5.7.284','tesseract.js@5','GRID_RATIOS','detectTableGrid','ocrGridPage','PDF → table conversion','View converted table','BET365_TABLE_IMPORT_VERSION="v3-pdf-to-table"','bettracker-import-cache-v1','bt365-viewport-layout-fix-v1','position:sticky;bottom:0;z-index:25','bt-event-time-v1','bt-bookmaker-running-balance-v1','b.app===r','t.bookmakerStartingBalances?.[r]']:
              assert x in s,x
          ded=s[s.index('window.bt365OpenDedicated'):s.index('window.bt365RestorePaddy')]
          assert 'bt-import-bookmaker' not in ded
          for sid in ['bt-online-controller','bt-v1-enhancer-script','bt-live-v2-enhancer','bt-import-bets-v1','bt-connections-card-import-v2','bt-bet365-import-v3']:
              m=re.search(r'<script[^>]*id="'+re.escape(sid)+r'"[^>]*>(.*?)</script>',s,re.S)
              assert m,sid
              Path('/tmp/'+sid+'.js').write_text(m.group(1))
          print('Verified bookmaker-specific timed balance build:',len(b),'bytes',hashlib.sha256(b).hexdigest())
          PYVERIFY
          node --check /tmp/bt-online-controller.js
          node --check /tmp/bt-v1-enhancer-script.js
          node --check /tmp/bt-live-v2-enhancer.js
          node --check /tmp/bt-import-bets-v1.js
          node --check /tmp/bt-connections-card-import-v2.js
          node --check /tmp/bt-bet365-import-v3.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# release: bookmaker-specific-timed-balances-v1
