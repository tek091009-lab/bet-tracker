name: Deploy Bet Tracker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify live Bet Tracker
        shell: bash
        run: |
          rm -rf dist && mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          import hashlib
          src=''.join(Path('app.b64').read_text().split())
          fix=''.join(Path(f'fix05/p{i}.b64').read_text() for i in range(6))
          assert len(src)==121204 and len(fix)==12000
          good=src[:97000]+fix+src[109000:]
          assert hashlib.sha256(good.encode()).hexdigest()=='34eb75c33807001ef90e9a83c26b35239044f4117287d30cc91fc0a13e9771c9'
          Path('/tmp/base.b64').write_text(good)
          PY
          base64 --decode /tmp/base.b64 | gzip -dc > dist/index.html
          cat upgrade/extra-*.b64 > /tmp/extra.b64
          base64 --decode /tmp/extra.b64 | gzip -dc > /tmp/bt-extra-body.html
          printf '\n' > /tmp/bt-extra.html
          cat /tmp/bt-extra-body.html >> /tmp/bt-extra.html
          python upgrade.py
          python release_patch.py
          python connections_patch.py
          python crash_hotfix.py
          python bettracker_hotfix.py
          python stability_patch.py
          python auth_isolation_patch.py
          python bet365_patch.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('dist/index.html'); b=p.read_bytes(); s=b.decode()
          assert len(b)==408740
          assert hashlib.sha256(b).hexdigest()=='8c7cdea779f910c19aa0596d617a0bb89a388c3c01240e68f0a9438279f2f380'
          assert '@users.holidaysavings.app' not in s
          assert 'Existing Bet Tracker Excel' not in s
          assert 'bt-bulk-bets-v1' not in s
          assert 'data-bet-id' not in s
          assert 'sessionStorage.clear()' not in s
          assert 'AUTH_NAMESPACE="bettracker-auth:"' in s
          for x in ['bt-online-controller','bt-live-v2-enhancer','bt-import-bets-v1','bt-connections-card-import-v2','bt-bet365-import-v1','"Bet365":{live:true','Read Bet365 statement','pdfjs-dist@5.7.284','tesseract.js@5']:
              assert x in s,x
          for sid in ['bt-online-controller','bt-v1-enhancer-script','bt-live-v2-enhancer','bt-import-bets-v1','bt-connections-card-import-v2','bt-bet365-import-v1']:
              m=re.search(r'<script[^>]*id="'+re.escape(sid)+r'"[^>]*>(.*?)</script>',s,re.S)
              assert m,sid
              Path('/tmp/'+sid+'.js').write_text(m.group(1))
          print('Verified Bet365 import release:',len(b),'bytes',hashlib.sha256(b).hexdigest())
          PY
          node --check /tmp/bt-online-controller.js
          node --check /tmp/bt-v1-enhancer-script.js
          node --check /tmp/bt-live-v2-enhancer.js
          node --check /tmp/bt-import-bets-v1.js
          node --check /tmp/bt-connections-card-import-v2.js
          node --check /tmp/bt-bet365-import-v1.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# release: bet365-statement-import-v1
