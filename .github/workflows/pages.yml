name: Deploy Bet Tracker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Bet Tracker website
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          tr -d '\r\n\t ' < app.b64 | base64 --decode | gzip -dc > dist/index.html
          test -s dist/index.html
          grep -q "Bet Tracker" dist/index.html
          grep -q "bt-online-controller" dist/index.html
          grep -q "bet-tracker-auth" dist/index.html
          echo "Built Bet Tracker: $(wc -c < dist/index.html) bytes"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
