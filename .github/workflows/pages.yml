name: Deploy Bet Tracker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify live Bet Tracker
        shell: bash
        run: |
          rm -rf dist && mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          import hashlib
          src=''.join(Path('app.b64').read_text().split())
          fix=''.join(Path(f'fix05/p{i}.b64').read_text() for i in range(6))
          assert len(src)==121204 and len(fix)==12000
          good=src[:97000]+fix+src[109000:]
          assert hashlib.sha256(good.encode()).hexdigest()=='34eb75c33807001ef90e9a83c26b35239044f4117287d30cc91fc0a13e9771c9'
          Path('/tmp/base.b64').write_text(good)
          PY
          base64 --decode /tmp/base.b64 | gzip -dc > dist/index.html
          cat upgrade/extra-*.b64 > /tmp/extra.b64
          base64 --decode /tmp/extra.b64 | gzip -dc > /tmp/bt-extra-body.html
          printf '\n' > /tmp/bt-extra.html
          cat /tmp/bt-extra-body.html >> /tmp/bt-extra.html
          python upgrade.py
          python release_patch.py
          python connections_patch.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('dist/index.html'); b=p.read_bytes(); s=b.decode()
          assert len(b)==393477
          assert hashlib.sha256(b).hexdigest()=='b0ee18f785f0fec55731ee3d619ac867c32693655eb282861d4b54ade9b4595c'
          assert '@users.holidaysavings.app' not in s
          assert 'Existing Bet Tracker Excel' not in s
          for x in ['bt-online-controller','bt-live-v2-enhancer','Save ladder to history','Your sports & betting apps','bet-tracker-live-v1','is[i]??{accent','bt-import-bets-v1','Paddy Power statement PDF','bookmakerStartingBalances','@users.bettracker.app','bt-bulk-bets-v1','data-bet-id','Delete selected','Select all filtered','Sport and Description are intentionally left blank','bt-connections-card-import-v2','bt-card-import','Import Paddy Power bets','bt-import-modal-backdrop']:
              assert x in s,x
          for sid in ['bt-online-controller','bt-v1-enhancer-script','bt-live-v2-enhancer','bt-import-bets-v1','bt-bulk-bets-v1','bt-connections-card-import-v2']:
              m=re.search(r'<script[^>]*id="'+re.escape(sid)+r'"[^>]*>(.*?)</script>',s,re.S)
              assert m,sid
              Path('/tmp/'+sid+'.js').write_text(m.group(1))
          print('Verified bookmaker-card import release:',len(b),'bytes',hashlib.sha256(b).hexdigest())
          PY
          node --check /tmp/bt-online-controller.js
          node --check /tmp/bt-v1-enhancer-script.js
          node --check /tmp/bt-live-v2-enhancer.js
          node --check /tmp/bt-import-bets-v1.js
          node --check /tmp/bt-bulk-bets-v1.js
          node --check /tmp/bt-connections-card-import-v2.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# release: bookmaker-card-import-v2
